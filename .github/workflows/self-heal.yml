# .github/workflows/self-heal.yml
name: self-heal
on:
  schedule: [{ cron: '0 2 * * *' }]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci && npx playwright install --with-deps
      - run: git checkout -b auto-heal/${{ github.run_id }}
      - run: node scripts/heal.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: node scripts/diff-guard.js origin/main
      
      - name: Show changes
        if: always()
        run: |
          git status --short
          git diff --stat
          git diff > test-results/heal.diff

      - name: Commit and open PR
        run: |
          git config user.name "auto-heal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A tests
          [ -d pages ] && git add -A pages || true
          git add -f test-results/suspected-bugs.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"; exit 0
          fi
          git commit -m "chore: auto-heal Playwright tests"
          git push origin HEAD
          gh pr create --fill --title "Auto-heal: fix Playwright failures"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}